name: Backend CI

# Run backend validation for every pushed commit and every pull request.
on:
  push:
  pull_request:

# Grant the workflow token only the repository-read access needed by checkout.
permissions:
  contents: read

jobs:
  backend:
    # Use GitHub's Ubuntu runner, the target operating system for this backend CI.
    runs-on: ubuntu-latest

    # Provide an isolated MongoDB instance for the backend startup smoke test.
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # All command steps are intentionally scoped to the backend only.
    defaults:
      run:
        working-directory: backend
        shell: bash

    steps:
      # Fetch the revision that triggered this workflow.
      - name: Check out repository
        uses: actions/checkout@v6

      # Install the latest patch release in the current Node.js LTS line and cache npm's download cache using the backend lockfile.
      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Perform a clean, lockfile-enforced dependency installation. npm ci fails on dependency or lockfile drift.
      - name: Install backend dependencies
        run: |
          set -euo pipefail
          npm ci

      # No lint script is defined in backend/package.json, so no lint command is run.
      # No test script is defined in backend/package.json, so no test command is run.
      # No build script is defined in backend/package.json. Validate the existing JavaScript source syntax instead.
      - name: Validate backend JavaScript syntax
        run: |
          set -euo pipefail
          find src -type f -name '*.js' -print0 | sort -z | xargs -0 -r -n1 node --check

      # The existing dev script starts the Express server. Confirm it connects to the CI MongoDB service and serves its root route.
      - name: Start backend and run smoke check
        env:
          MOGODB_URL: mongodb://127.0.0.1:27017/online-store-ci

          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          npm run dev > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/ >/dev/null; then
              exit 0
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Backend exited before becoming ready."
              cat server.log
              exit 1
            fi

            sleep 1
          done

          echo "Backend did not become ready within 30 seconds."
          cat server.log
          exit 1
